# 极简版：只有「手动选一台 / 自动最快」两种模式，没有地区分组、没有业务分组。
#
#   模式一（手动）：进「🚀 节点选择」，点哪台用哪台，不自动跳。
#   模式二（自动）：进「🚀 节点选择」，点第一项「♻️ 自动选择」，此时在全部节点里
#                   测速取最快的那台；它挂了会被测速剔除，自动换下一个。
#
# 节点来自你的订阅全量，不按地区拆 provider。换订阅只改下面 proxy-providers 那一行。
#
# 国内流量（含银行 App）三层直连：银行域名 → geosite:cn → GEOIP,CN。
# 需要「所有流量都走代理」时，切「🌐 全局代理」或客户端内核的 GLOBAL 模式。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: off
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

# ---------------------------------------------------------------- DNS
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 关键：代理流量（境外域名）必须用境外 DNS 解析，不能走大陆 DNS。
  # 否则 Cloudflare 这类站会拿到"大陆方向"的边缘 IP，触发地区风控。
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

# ------------------------------------------------- GeoIP / GeoSite 数据库
# GEOIP,CN 要用；默认的 GitHub 源国内拉不动，换 jsdelivr（cdn 比 testingcf 稳）。
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb
geo-auto-update: true
geo-update-interval: 168

# ---------------------------------------------------------------- 节点源
# 这里填你的订阅地址（Sub-Store 合集下载链接，或任何 mihomo 节点订阅）。
# VPS 废了、换了订阅，只改这一行就行，其余配置不用动。
proxy-providers:
  all:
    type: http
    url: "在这里填你的订阅地址"
    interval: 3600
    path: ./proxy_providers/all.yaml
    health-check: {enable: true, url: http://www.gstatic.com/generate_204, interval: 300}

# ---------------------------------------------------------------- 分组
proxy-groups:

  # 「节点选择」= 你的总开关。
  #   第一项「🌐 全局代理」→ 全部流量走代理
  #   第二项「♻️ 自动选择」→ 自动模式
  #   下面的每一台具体节点  → 手动模式（点了就固定用这台）
  - name: 🚀 节点选择
    type: select
    proxies: [🌐 全局代理, ♻️ 自动选择]
    use: [all]

  # 全局代理：内部就是「自动选择」，等于"所有流量都走自动测速选中的节点"。
  - name: 🌐 全局代理
    type: select
    proxies: [♻️ 自动选择]

  # 自动模式的本体：全部节点测速，取延迟最低的。
  # 某台连不上会被测速判死、自动排除，也就是「断了换下一个」。
  - name: ♻️ 自动选择
    type: url-test
    use: [all]
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false

  # 分流开关：控制「国内流量」走直连还是走代理。
  #   默认「直连」= 国内直连、国外代理（正常状态）
  #   切到「全局代理」= 国内也走代理
  - name: 🔀 分流开关
    type: select
    proxies: [DIRECT, 🌐 全局代理]

# ---------------------------------------------------------------- 规则
# 国内流量统一走「🔀 分流开关」：默认直连，需要全局代理时切开关即可。
rules:
  # 1. 本机与局域网（永远直连，不随开关走）
  - GEOIP,LAN,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - RULE-SET,private,DIRECT

  # 2. 银行 / 金融：单独提前判。
  # 这些域名有的解析到海外 CDN，只靠下面的 GEOIP,CN 会漏判成国外 → 走代理 → App 报错。
  - RULE-SET,bank-cn,🔀 分流开关

  # 3. 国内主流网站：geosite:cn 一条覆盖（淘宝/微信/B站/百度/知乎/京东/12306…）
  - RULE-SET,cn-domain,🔀 分流开关

  # 4. 更宽的国内兜底：域名不在 cn 名单里、但服务器落在国内的（海外域名+国内 CDN 等）
  - RULE-SET,geolocation-cn,🔀 分流开关

  # 5. 国内 IP 兜底（App 直连 IP、不走域名的情况）
  - GEOIP,CN,🔀 分流开关,no-resolve

  # 6. 其余全部走代理
  - MATCH,🚀 节点选择

# ---------------------------------------------------------------- 规则集
# 直接指向 MetaCubeX 官方源（meta-rules-dat），社区持续更新，无需自己维护。
# 不再自托管：彻底摆脱对自建 VPS 的依赖，永远跟官方同步。
rule-providers:
  private:        {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"}
  bank-cn:        {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-bank-cn.mrs"}
  cn-domain:      {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"}
  geolocation-cn: {type: http, behavior: domain, format: mrs, interval: 86400, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-cn.mrs"}

# ---------------------------------------------------------------- 流量嗅探
# 有些 App 直接连 IP、不送域名，嗅探能把域名还原出来，GEOIP,CN 判得更准。
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
  skip-domain:
    - "+.apple.com"
    - "+.mijia.com"
    - "+.mi.com"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
